[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vet-vision-eval-pipeline"
version = "1.0.0"
description = "Educational cattle vision and welfare telemetry learning pipeline (YOLO, DuckDB, calving analytics)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Gollogly" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "duckdb>=1.0.0",
  "pandas>=2.0.0",
  "opencv-python-headless>=4.8.0",
  "numpy>=1.24.0",
  "ultralytics>=8.0.0",
  "torch>=2.0.0",
  "lap>=0.5.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
py-modules = [
  "analytics_engine",
  "calving_analytics",
  "camera_connector",
  "cattle_vision_pipeline",
  "db_setup",
  "package_version",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]